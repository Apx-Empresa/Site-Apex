<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Exemplo de site criado pela ApexSite." />
  <title>Exemplo de site | ApexSite</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="demo-page">
  <header class="demo-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="Voltar para a ApexSite">
        <span class="brand-mark" aria-hidden="true">▲</span>
        <span class="brand-text">ApexSite</span>
      </a>
      <a class="demo-back" href="index.html#precos">← Voltar para os planos</a>
    </div>
  </header>

  <main>
    <section class="demo-hero">
      <div class="container demo-hero-inner">
        <div>
          <span class="demo-kicker" id="demo-kicker">Exemplo de projeto</span>
          <h1 id="demo-title">Um site pensado para o seu negócio.</h1>
          <p id="demo-description">Veja como podemos apresentar sua marca com clareza, personalidade e foco em resultados.</p>
          <a class="button button-primary" href="https://wa.me/11932230010?text=Ol%C3%A1!%20Gostaria%20de%20criar%20um%20site%20como%20esse." target="_blank" rel="noopener noreferrer">Quero um site assim</a>
        </div>
        <div class="demo-preview" aria-label="Prévia ilustrativa do site">
          <div class="demo-preview-bar">
            <span id="preview-brand">Sua Marca</span>
            <span>☰</span>
          </div>
          <div class="demo-preview-line"></div>
          <div class="demo-preview-line short"></div>
          <div class="demo-preview-grid"><span></span><span></span><span></span></div>
        </div>
      </div>
    </section>

    <section class="demo-features">
      <div class="container">
        <h2>O que este exemplo pode ter</h2>
        <div class="demo-feature-grid" id="demo-features"></div>
      </div>
    </section>
  </main>

  <script src="demo.js"></script>
</body>
</html>
